[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#CBD5E1"
font = "sans-serif"
baseFontSize = 16
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
linkUnderline = false
chartCategoricalColors = ["#1D4ED8", "#0F766E", "#B45309", "#7C3AED", "#BE123C"]

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#CBD5E1"

[theme.dark]
primaryColor = "#93C5FD"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
borderColor = "#475569"
